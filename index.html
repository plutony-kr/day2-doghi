<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리집 강아지 탄이를 소개합니다</title>
</head>
<body>
  <header>
    <h1>우리집 강아지 탄이를 소개합니다</h1>
    <p>만나러 오기 전에 미리 읽어봐 주세요!</p>
  </header>

  <main>
    <section id="profile">
      <h2>프로필</h2>
      <table>
        <tr><th>이름</th><td>탄이</td></tr>
        <tr><th>견종</th><td>세이블 포메라니안</td></tr>
        <tr><th>나이</th><td>7살</td></tr>
        <tr><th>성별</th><td>남아</td></tr>
        <tr><th>몸무게</th><td>8kg</td></tr>
      </table>
    </section>

    <section id="personality">
      <h2>성격</h2>
      <ul>
        <li>사람을 좋아해요</li>
        <li>처음 보는 강아지는 무서워해요</li>
      </ul>
    </section>

    <section id="likes">
      <h2>좋아하는 것</h2>
      <ul>
        <li>산책</li>
        <li>삑삑이 공</li>
        <li>고구마 간식</li>
      </ul>
    </section>

    <section id="routine">
      <h2>하루 일과</h2>
      <ol>
        <li>아침 7시 산책</li>
        <li>낮잠</li>
        <li>저녁 7시 산책</li>
        <li>밤 10시 잠</li>
      </ol>
    </section>

    <section id="caution">
      <h2>만날 때 주의</h2>
      <ul>
        <li>갑자기 안아 올리지 않기</li>
        <li>사람 음식 주지 않기</li>
      </ul>
    </section>

    <section id="photos">
      <h2>사진</h2>
      <div class="photo-grid">
        <button type="button" class="photo">사진 1</button>
        <button type="button" class="photo">사진 2</button>
        <button type="button" class="photo">사진 3</button>
        <button type="button" class="photo">사진 4</button>
        <button type="button" class="photo">사진 5</button>
        <button type="button" class="photo">사진 6</button>
      </div>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
    <div class="modal-box">
      <div id="modal-photo" class="modal-photo"></div>
      <button type="button" id="modal-close">닫기</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalPhoto = document.getElementById('modal-photo');
    const closeBtn = document.getElementById('modal-close');
    let lastPhoto = null;

    function openModal(photo) {
      lastPhoto = photo;
      modalPhoto.textContent = photo.textContent;
      modal.hidden = false;
      closeBtn.focus();
    }

    function closeModal() {
      modal.hidden = true;
      if (lastPhoto) lastPhoto.focus();
    }

    document.querySelectorAll('.photo').forEach(function (photo) {
      photo.addEventListener('click', function () { openModal(photo); });
    });

    closeBtn.addEventListener('click', closeModal);

    // 배경(어두운 부분)을 누르면 닫기
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    // Esc 키로 닫기
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  </script>
</body>
</html>
