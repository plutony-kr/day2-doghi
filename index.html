<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리집 강아지 탄이를 소개합니다</title>
  <style>
    @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.6/dist/web/static/pretendard.css");

    /* 라프텔 design.md 다크 테마 토큰 */
    :root {
      --point: #816bff;
      --point-hover: #6a54e6;
      --white: #ffffff;
      --bg-1: #121212;
      --bg-2: #000000;
      --bg-3: #323232;
      --bg-4: #505050;
      --fg-1: #f7f7f7;
      --fg-2: #e2e2e2;
      --fg-3: #ababab;
      --fg-4: #636363;
      --border-1: #323232;
      --border-2: #505050;
      --badge-red: #ff1010;
      --radius-xs: 3px;
      --radius-sm: 4px;
      --radius-pill: 9999px;
      --space-8: 8px;
      --space-12: 12px;
      --space-16: 16px;
      --space-24: 24px;
      --space-40: 40px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0 var(--space-16) var(--space-40);
      background: var(--bg-2);
      color: var(--fg-1);
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      font-size: 16px;
      font-weight: 400;
      line-height: 24px;
    }

    :focus-visible { outline: 2px solid var(--point); outline-offset: 2px; }

    /* 헤더: 높이 64px 이상, 어두운 면 + 하단 1px 선 */
    header {
      margin: 0 calc(var(--space-16) * -1);
      padding: var(--space-24) var(--space-16);
      background: var(--bg-1);
      border-bottom: 1px solid var(--border-1);
      text-align: center;
    }
    header h1 { margin: 0; font-size: 32px; line-height: 48px; font-weight: 700; }
    header h1 span { color: var(--point); }
    header p { margin: 0; color: var(--fg-3); }

    main { max-width: 640px; margin: 0 auto; }

    section {
      background: var(--bg-1);
      border: 1px solid var(--border-1);
      border-radius: var(--radius-sm);
      padding: var(--space-24);
      margin-top: var(--space-16);
    }
    section h2 {
      margin: 0 0 var(--space-12);
      font-size: 16px;
      line-height: 24px;
      font-weight: 700;
      color: var(--fg-1);
    }
    /* 보라 포인트는 신호에만: 제목 앞 작은 막대 */
    section h2::before {
      content: "";
      display: inline-block;
      width: 4px;
      height: 14px;
      margin-right: 8px;
      vertical-align: -1px;
      border-radius: var(--radius-xs);
      background: var(--point);
    }

    /* 프로필 표 */
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: var(--space-12) 0; text-align: left; border-bottom: 1px solid var(--border-1); }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    th { width: 30%; color: var(--fg-3); font-size: 14px; line-height: 21px; font-weight: 700; }
    td { color: var(--fg-1); }

    ul, ol { margin: 0; padding: 0; list-style: none; }

    /* 성격 */
    #personality li {
      background: var(--bg-3);
      border-radius: var(--radius-sm);
      padding: var(--space-12) var(--space-16);
      margin-bottom: var(--space-8);
      color: var(--fg-2);
    }
    #personality li:last-child { margin-bottom: 0; }

    /* 좋아하는 것: 활성 칩 (보라 알약) */
    #likes ul { display: flex; flex-wrap: wrap; gap: var(--space-8); }
    #likes li {
      height: 36px;
      padding: 0 var(--space-16);
      border-radius: var(--radius-pill);
      background: var(--point);
      color: var(--white);
      font-size: 14px;
      font-weight: 700;
      line-height: 36px;
    }

    /* 하루 일과: N 배지 느낌의 보라 원형 번호 */
    #routine ol { counter-reset: step; }
    #routine li {
      counter-increment: step;
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--bg-3);
      border-radius: var(--radius-sm);
      padding: var(--space-12) var(--space-16);
      margin-bottom: var(--space-8);
      color: var(--fg-2);
    }
    #routine li:last-child { margin-bottom: 0; }
    #routine li::before {
      content: counter(step);
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: var(--point);
      color: var(--white);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      line-height: 24px;
    }

    /* 주의: 빨강 배지 */
    #caution li {
      display: flex;
      align-items: center;
      gap: var(--space-12);
      background: var(--bg-3);
      border-radius: var(--radius-sm);
      padding: var(--space-12) var(--space-16);
      margin-bottom: var(--space-8);
      color: var(--fg-2);
    }
    #caution li:last-child { margin-bottom: 0; }
    #caution li::before {
      content: "주의";
      flex: none;
      height: 17px;
      padding: 0 6px;
      border-radius: var(--radius-xs);
      background: var(--badge-red);
      color: var(--white);
      font-size: 10px;
      font-weight: 700;
      line-height: 17px;
    }

    .hint { margin: 0 0 var(--space-12); color: var(--fg-3); font-size: 14px; line-height: 21px; }

    /* 사진 */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: var(--space-12);
    }
    .photo {
      display: block;
      width: 100%;
      aspect-ratio: 1 / 1;
      padding: 0;
      border: 0;
      border-radius: var(--radius-sm);
      overflow: hidden;
      cursor: pointer;
      background: var(--bg-3);
    }
    .photo:hover { opacity: 0.85; }
    .photo svg, .modal-photo svg { display: block; width: 100%; height: 100%; }

    /* 모달 */
    .modal {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-16);
      background: rgba(0, 0, 0, 0.75);
      z-index: 10;
    }
    .modal[hidden] { display: none; }
    .modal-box {
      width: 100%;
      max-width: 420px;
      background: var(--bg-1);
      border: 1px solid var(--border-2);
      border-radius: var(--radius-sm);
      padding: var(--space-16);
      text-align: center;
    }
    .modal-photo {
      width: 100%;
      aspect-ratio: 1 / 1;
      border-radius: var(--radius-sm);
      overflow: hidden;
    }
    #modal-caption { margin: var(--space-12) 0 0; font-weight: 700; color: var(--fg-1); }
    #modal-close {
      margin-top: var(--space-12);
      height: 45px;
      padding: 0 var(--space-40);
      border: 0;
      border-radius: var(--radius-sm);
      background: var(--point);
      color: var(--white);
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    #modal-close:hover { background: var(--point-hover); }

    @media (max-width: 480px) {
      header h1 { font-size: 24px; line-height: 36px; }
    }

    @media (min-width: 560px) {
      .photo-grid { grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
  <!-- 탄이 그림 재료 (화면에는 보이지 않음) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- 얼굴 바탕: 세이블 포메 -->
      <symbol id="dog-base" viewBox="0 0 100 100">
        <path d="M16 42 L22 6 L48 24 Z" fill="#c07a38"/>
        <path d="M84 42 L78 6 L52 24 Z" fill="#c07a38"/>
        <path d="M24 32 L26 16 L38 25 Z" fill="#ffb8c6"/>
        <path d="M76 32 L74 16 L62 25 Z" fill="#ffb8c6"/>
        <circle cx="50" cy="56" r="38" fill="#e8a862"/>
        <circle cx="17" cy="64" r="13" fill="#e8a862"/>
        <circle cx="83" cy="64" r="13" fill="#e8a862"/>
        <path d="M18 46 Q50 6 82 46 Q50 28 18 46 Z" fill="#b97330"/>
        <ellipse cx="50" cy="70" rx="19" ry="15" fill="#fdebd0"/>
        <ellipse cx="50" cy="62" rx="5.5" ry="3.8" fill="#3b2a24"/>
        <path d="M50 66 V71 M50 71 Q44 76 39 72 M50 71 Q56 76 61 72" stroke="#3b2a24" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <circle cx="22" cy="68" r="5" fill="#ffb8c6" opacity="0.6"/>
        <circle cx="78" cy="68" r="5" fill="#ffb8c6" opacity="0.6"/>
      </symbol>
      <!-- 눈 뜬 탄이 -->
      <symbol id="dog" viewBox="0 0 100 100">
        <use href="#dog-base" width="100" height="100"/>
        <circle cx="35" cy="52" r="4.2" fill="#3b2a24"/>
        <circle cx="65" cy="52" r="4.2" fill="#3b2a24"/>
        <circle cx="36.5" cy="50.5" r="1.4" fill="#fff"/>
        <circle cx="66.5" cy="50.5" r="1.4" fill="#fff"/>
      </symbol>
      <!-- 눈 감은 탄이 -->
      <symbol id="dog-sleep" viewBox="0 0 100 100">
        <use href="#dog-base" width="100" height="100"/>
        <path d="M29 52 Q35 58 41 52" stroke="#3b2a24" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        <path d="M59 52 Q65 58 71 52" stroke="#3b2a24" stroke-width="2.4" fill="none" stroke-linecap="round"/>
      </symbol>
    </defs>
  </svg>

  <header>
    <h1>우리집 강아지 <span>탄이</span>를 소개합니다</h1>
    <p>만나러 오기 전에 미리 읽어봐 주세요!</p>
  </header>

  <main>
    <section id="profile">
      <h2>프로필</h2>
      <table>
        <tr><th>이름</th><td>탄이</td></tr>
        <tr><th>견종</th><td>세이블 포메라니안</td></tr>
        <tr><th>나이</th><td>7살</td></tr>
        <tr><th>성별</th><td>남아</td></tr>
        <tr><th>몸무게</th><td>8kg</td></tr>
      </table>
    </section>

    <section id="personality">
      <h2>성격</h2>
      <ul>
        <li>사람을 좋아해요</li>
        <li>처음 보는 강아지는 무서워해요</li>
      </ul>
    </section>

    <section id="likes">
      <h2>좋아하는 것</h2>
      <ul>
        <li>산책</li>
        <li>삑삑이 공</li>
        <li>고구마 간식</li>
      </ul>
    </section>

    <section id="routine">
      <h2>하루 일과</h2>
      <ol>
        <li>아침 7시 산책</li>
        <li>낮잠</li>
        <li>저녁 7시 산책</li>
        <li>밤 10시 잠</li>
      </ol>
    </section>

    <section id="caution">
      <h2>만날 때 주의</h2>
      <ul>
        <li>갑자기 안아 올리지 않기</li>
        <li>사람 음식 주지 않기</li>
      </ul>
    </section>

    <section id="photos">
      <h2>사진</h2>
      <p class="hint">사진을 누르면 크게 볼 수 있어요.</p>
      <div class="photo-grid">

        <!-- 1. 기본 인물사진 -->
        <button type="button" class="photo" data-caption="탄이 (7살, 세이블 포메)">
          <svg viewBox="0 0 200 200" role="img" aria-label="웃고 있는 탄이">
            <rect width="200" height="200" fill="#ffe0ea"/>
            <circle cx="30" cy="35" r="22" fill="#ffd0df"/>
            <circle cx="175" cy="170" r="28" fill="#ffd0df"/>
            <ellipse cx="100" cy="185" rx="50" ry="36" fill="#e8a862"/>
            <ellipse cx="100" cy="190" rx="26" ry="26" fill="#fdebd0"/>
            <use href="#dog" x="40" y="50" width="120" height="120"/>
            <ellipse cx="100" cy="134" rx="6" ry="8" fill="#ff8fa8"/>
            <text x="22" y="110" font-size="20" fill="#ff8fa8">♥</text>
            <text x="165" y="70" font-size="16" fill="#ff8fa8">♥</text>
          </svg>
        </button>

        <!-- 2. 아침 산책 -->
        <button type="button" class="photo" data-caption="아침 7시, 산책 나온 탄이">
          <svg viewBox="0 0 200 200" role="img" aria-label="산책하는 탄이">
            <rect width="200" height="200" fill="#d6ebff"/>
            <circle cx="165" cy="35" r="20" fill="#fff0a8"/>
            <ellipse cx="50" cy="40" rx="26" ry="10" fill="#fff"/>
            <ellipse cx="68" cy="34" rx="18" ry="9" fill="#fff"/>
            <rect x="26" y="95" width="10" height="45" fill="#c9a07a"/>
            <circle cx="31" cy="85" r="26" fill="#a8dcae"/>
            <ellipse cx="100" cy="200" rx="140" ry="55" fill="#bfe8c0"/>
            <ellipse cx="100" cy="170" rx="42" ry="22" fill="#e8a862"/>
            <use href="#dog" x="45" y="75" width="110" height="110"/>
            <path d="M150 130 Q170 150 185 120" stroke="#ff8fa8" stroke-width="3" fill="none"/>
            <text x="12" y="188" font-size="12" fill="#4f8f5a">🌿</text>
            <text x="150" y="190" font-size="12" fill="#4f8f5a">🌼</text>
          </svg>
        </button>

        <!-- 3. 삑삑이 공 -->
        <button type="button" class="photo" data-caption="삑삑이 공이 제일 좋아!">
          <svg viewBox="0 0 200 200" role="img" aria-label="삑삑이 공과 탄이">
            <rect width="200" height="200" fill="#fff3c4"/>
            <circle cx="20" cy="25" r="5" fill="#ffe27a"/>
            <circle cx="180" cy="40" r="7" fill="#ffe27a"/>
            <circle cx="170" cy="165" r="5" fill="#ffe27a"/>
            <ellipse cx="100" cy="188" rx="48" ry="30" fill="#e8a862"/>
            <use href="#dog" x="40" y="45" width="120" height="120"/>
            <ellipse cx="100" cy="133" rx="5.5" ry="8" fill="#ff8fa8"/>
            <circle cx="160" cy="150" r="22" fill="#ff9ec0"/>
            <path d="M142 142 Q160 132 178 142" stroke="#fff" stroke-width="3" fill="none"/>
            <text x="146" y="162" font-size="13" font-weight="bold" fill="#fff">삑!</text>
            <path d="M175 118 l8 -8 M185 135 l10 -2 M135 118 l-6 -8" stroke="#ffb347" stroke-width="3" stroke-linecap="round"/>
          </svg>
        </button>

        <!-- 4. 고구마 간식 -->
        <button type="button" class="photo" data-caption="고구마 간식 냠냠">
          <svg viewBox="0 0 200 200" role="img" aria-label="고구마를 먹으려는 탄이">
            <rect width="200" height="200" fill="#e8defb"/>
            <circle cx="25" cy="170" r="20" fill="#dcd0f5"/>
            <circle cx="180" cy="30" r="16" fill="#dcd0f5"/>
            <ellipse cx="100" cy="188" rx="48" ry="30" fill="#e8a862"/>
            <use href="#dog" x="35" y="40" width="120" height="120"/>
            <g transform="rotate(-25 150 150)">
              <ellipse cx="150" cy="150" rx="30" ry="14" fill="#a8527a"/>
              <ellipse cx="124" cy="150" rx="6" ry="11" fill="#ffc15e"/>
              <path d="M140 143 Q150 140 162 144" stroke="#c97a9c" stroke-width="2" fill="none"/>
            </g>
            <text x="120" y="108" font-size="16" fill="#ff8fa8">♥</text>
            <text x="165" y="100" font-size="12" fill="#ff8fa8">♥</text>
          </svg>
        </button>

        <!-- 5. 낮잠 -->
        <button type="button" class="photo" data-caption="낮잠 시간, 쿨쿨">
          <svg viewBox="0 0 200 200" role="img" aria-label="낮잠 자는 탄이">
            <rect width="200" height="200" fill="#d9f2e6"/>
            <text x="135" y="55" font-size="26" font-weight="bold" fill="#7bbf9c">Z</text>
            <text x="155" y="35" font-size="18" font-weight="bold" fill="#9fd2b8">z</text>
            <text x="172" y="20" font-size="12" font-weight="bold" fill="#b6e0cb">z</text>
            <ellipse cx="100" cy="170" rx="85" ry="26" fill="#ffc9d9"/>
            <ellipse cx="100" cy="160" rx="75" ry="22" fill="#ffd9e5"/>
            <ellipse cx="100" cy="150" rx="52" ry="26" fill="#e8a862"/>
            <use href="#dog-sleep" x="40" y="55" width="120" height="120"/>
          </svg>
        </button>

        <!-- 6. 밤 10시 잠 -->
        <button type="button" class="photo" data-caption="밤 10시, 잘 자 탄이">
          <svg viewBox="0 0 200 200" role="img" aria-label="밤에 잠든 탄이">
            <rect width="200" height="200" fill="#c9cff2"/>
            <circle cx="160" cy="45" r="24" fill="#fff6d0"/>
            <circle cx="170" cy="38" r="22" fill="#c9cff2"/>
            <text x="30" y="40" font-size="14" fill="#fff6d0">★</text>
            <text x="75" y="25" font-size="10" fill="#fff6d0">★</text>
            <text x="120" y="60" font-size="12" fill="#fff6d0">★</text>
            <text x="20" y="90" font-size="10" fill="#fff6d0">★</text>
            <ellipse cx="100" cy="188" rx="48" ry="30" fill="#e8a862"/>
            <use href="#dog-sleep" x="40" y="50" width="120" height="120"/>
            <path d="M15 200 Q100 135 185 200 Z" fill="#a8b2ee"/>
            <path d="M15 200 Q100 150 185 200 Z" fill="#b9c2f5"/>
            <text x="90" y="35" font-size="16" font-weight="bold" fill="#fff">z</text>
          </svg>
        </button>

      </div>
    </section>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="사진 크게 보기" hidden>
    <div class="modal-box">
      <div id="modal-photo" class="modal-photo"></div>
      <p id="modal-caption"></p>
      <button type="button" id="modal-close">닫기</button>
    </div>
  </div>

  <script>
    const modal = document.getElementById('modal');
    const modalPhoto = document.getElementById('modal-photo');
    const modalCaption = document.getElementById('modal-caption');
    const closeBtn = document.getElementById('modal-close');
    let lastPhoto = null;

    function openModal(photo) {
      lastPhoto = photo;
      modalPhoto.replaceChildren(photo.querySelector('svg').cloneNode(true));
      modalCaption.textContent = photo.dataset.caption;
      modal.hidden = false;
      closeBtn.focus();
    }

    function closeModal() {
      modal.hidden = true;
      if (lastPhoto) lastPhoto.focus();
    }

    document.querySelectorAll('.photo').forEach(function (photo) {
      photo.addEventListener('click', function () { openModal(photo); });
    });

    closeBtn.addEventListener('click', closeModal);

    // 배경(어두운 부분)을 누르면 닫기
    modal.addEventListener('click', function (e) {
      if (e.target === modal) closeModal();
    });

    // Esc 키로 닫기
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && !modal.hidden) closeModal();
    });
  </script>
</body>
</html>
